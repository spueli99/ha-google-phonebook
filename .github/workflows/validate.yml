name: Validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tools
        run: python -m pip install pytest ruff

      - name: Ruff
        run: ruff check custom_components tests

      - name: Tests
        run: pytest -q
